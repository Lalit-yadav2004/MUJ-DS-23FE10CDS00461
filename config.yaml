# ==============================================================================
# CodePulse AI - System Configuration
# ==============================================================================
# Production-Grade Multi-Agent Code Security Triage & Remediation Engine
# ==============================================================================

app:
  name: "CodePulse AI"
  version: "1.0.0"
  environment: "production"
  debug: false

# LLM Provider Configuration
# Supported providers: "gemini", "mock" (offline/zero-key evaluation)
llm:
  default_provider: "gemini"
  gemini:
    model: "models/gemini-3.8-flash"
    fallback_model: "models/gemini-3.1-pro-preview"
    temperature: 0.1
    max_output_tokens: 3072
    timeout_seconds: 45
    max_retries: 3
    retry_backoff_factor: 2.0
  mock:
    simulate_latency: true
    latency_range_ms: [400, 900]

# Multi-Agent Workflow Parameters
agents:
  # Stage 1: Vulnerability Hunter (Candidate Identification)
  hunter:
    temperature: 0.1
    top_p: 0.95
    max_candidates_per_file: 5
    enable_cot_reasoning: true

  # Stage 2: Security Auditor (Devil's Advocate & False Positive Elimination)
  auditor:
    temperature: 0.05
    confidence_threshold: 0.65 # Minimum confidence score (0.0 to 1.0) to confirm a bug
    require_exploit_path: true
    cross_check_sanitizers: true

  # Stage 3: Patch Synthesizer (Unified Diff & Security Unit Test Generation)
  patcher:
    temperature: 0.1
    generate_diff: true
    generate_regression_tests: true
    enforce_backward_compatibility: true

# AST & Static Semantic Preprocessing
parser:
  max_file_size_kb: 512
  supported_extensions:
    - ".py"
    - ".js"
    - ".ts"
    - ".go"
  extract_call_graph: true
  extract_sanitizer_nodes: true

# Semantic Caching & Telemetry
cache:
  enabled: true
  backend: "memory" # "memory" or "disk"
  cache_dir: ".cache/codepulse"
  ttl_seconds: 86400

telemetry:
  track_tokens: true
  cost_rates:
    gemini-1.5-flash:
      input_per_million: 0.075
      output_per_million: 0.30
    gemini-1.5-pro:
      input_per_million: 1.25
      output_per_million: 5.00

# Targeted Vulnerability Categories (OWASP Top 10 / Common CWEs)
ruleset:
  active_cwes:
    - id: "CWE-89"
      name: "SQL Injection"
      severity: "CRITICAL"
    - id: "CWE-78"
      name: "OS Command Injection"
      severity: "CRITICAL"
    - id: "CWE-22"
      name: "Improper Limitation of a Pathname (Path Traversal)"
      severity: "HIGH"
    - id: "CWE-502"
      name: "Deserialization of Untrusted Data"
      severity: "CRITICAL"
    - id: "CWE-79"
      name: "Cross-site Scripting (XSS)"
      severity: "HIGH"
    - id: "CWE-798"
      name: "Use of Hard-coded Credentials"
      severity: "HIGH"
    - id: "CWE-918"
      name: "Server-Side Request Forgery (SSRF)"
      severity: "HIGH"
    - id: "CWE-327"
      name: "Use of Broken or Risky Cryptographic Algorithm"
      severity: "MEDIUM"
